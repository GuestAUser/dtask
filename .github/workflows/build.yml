name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and exercise the CLI and real terminal
        run: |
          make test DC=ldc2
          ./bin/dtask --version
      - name: Build with DUB
        run: |
          dub build --compiler=ldc2 --build=release
          ./bin/dtask --version
      - name: Verify staged installation
        run: |
          make install DC=ldc2 PREFIX=/usr/local DESTDIR="${RUNNER_TEMP}/dtask-install"
          "${RUNNER_TEMP}/dtask-install/usr/local/bin/dtask" --version
      - name: Verify installer and global launch
        run: |
          sh -n install.sh
          prefix="${RUNNER_TEMP}/dtask user install"
          cd "${RUNNER_TEMP}"
          DC=ldc2 "${GITHUB_WORKSPACE}/install.sh" --prefix "$prefix"
          export PATH="$prefix/bin:$PATH"
          test "$(command -v dtask)" = "$prefix/bin/dtask"
          dtask --version
